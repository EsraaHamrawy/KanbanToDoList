databases:
  - name: todo-db
    plan: free
    databaseName: todo
    user: todo

services:
  - type: web
    name: todo-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run db:push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
      - key: CORS_ORIGIN
        fromService:
          type: static_site
          name: todo-frontend
          property: host

  - type: static_site
    name: todo-frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: todo-backend
          property: host
